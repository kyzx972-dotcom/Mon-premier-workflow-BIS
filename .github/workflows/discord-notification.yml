name: Notification Discord avec URL dynamique

on:
  workflow_run:
    workflows: ["Generate Image from Commit"]
    types:
      - completed

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Cloner le dépôt GitHub
        uses: actions/checkout@v4

      - name: Récupérer le message du dernier commit
        run: echo "MESSAGE=$(git log -1 --pretty=%s)" >> $GITHUB_ENV

      - name: Télécharger l'artefact contenant l'image
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire le nom du fichier et construire l'URL
        run: |
          IMAGE_NAME=$(ls ./artifacts | head -n 1)
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          IMAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$IMAGE_NAME"
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV
          echo "Image trouvée : $IMAGE_NAME"
          echo "URL construite : $IMAGE_URL"

      - name: Envoyer la notification sur Discord
        run: |
          payload=$(jq -n \
            --arg message "$MESSAGE" \
            --arg image_url "$IMAGE_URL" \
            '{
              username: "Github BOT",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [{
                title: "🎨 Nouvelle image générée",
                description: ("📝 **Commit** : " + $message + "\n📷 **Image** : " + $image_url),
                image: { url: $image_url },
                color: 15258703,
                footer: { text: "Github Action - Automatisation" }
              }]
            }')
          echo "Payload JSON: $payload"
          curl -H "Content-Type: application/json" -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -d "$payload"