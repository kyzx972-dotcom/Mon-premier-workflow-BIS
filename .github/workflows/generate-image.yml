name: Generate Image from Commit

on:
  push:
    branches: [ main ]

permissions:
  contents: write   # nécessaire pour recommit + déploiement gh-pages

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Récupérer le message du dernier commit
        id: commit
        run: |
          # %s = uniquement la 1re ligne (sujet) du commit
          MESSAGE=$(git log -1 --pretty=%s)
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MESSAGE"       >> "$GITHUB_OUTPUT"
          echo "EOF"            >> "$GITHUB_OUTPUT"

      - name: Générer l'image via DynaPictures
        id: generate
        env:
          API_KEY: ${{ secrets.DYNAPICTURES_API_KEY }}
          TEMPLATE_UID: ${{ secrets.DYNAPICTURES_TEMPLATE_UID }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
        run: |
          # jq construit le JSON en échappant proprement le message
          PAYLOAD=$(jq -n --arg text "$COMMIT_MESSAGE" \
            '{params: [{name: "title", text: $text}]}')

          echo "Payload envoyé : $PAYLOAD"

          RESPONSE=$(curl -s -X POST \
            "https://api.dynapictures.com/designs/${TEMPLATE_UID}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Réponse API : $RESPONSE"
          IMAGE_URL=$(echo "$RESPONSE" | jq -r '.imageUrl')

          if [ -z "$IMAGE_URL" ] || [ "$IMAGE_URL" = "null" ]; then
            echo "❌ Aucune image générée. Vérifie l'UID, la clé et le nom du calque."
            exit 1
          fi
          echo "url=$IMAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Télécharger l'image dans /images/
        run: |
          mkdir -p images
          FILENAME="images/$(date +%Y%m%d-%H%M%S).png"
          curl -s -L "${{ steps.generate.outputs.url }}" -o "$FILENAME"
          echo "✅ Image enregistrée : $FILENAME"

      - name: Générer index.html
        run: |
          cd images
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="fr"><head><meta charset="UTF-8">'
            echo '<title>Images générées</title>'
            echo '<style>body{font-family:sans-serif;max-width:900px;margin:auto;padding:2rem}
                  figure{margin:2rem 0}img{max-width:100%;border:1px solid #ddd;border-radius:8px}</style>'
            echo '</head><body><h1>🎨 Images générées à partir des commits</h1>'
            for img in *.png; do
              [ -e "$img" ] || continue
              echo "<figure><img src=\"$img\"><figcaption>$img</figcaption></figure>"
            done
            echo '</body></html>'
          } > index.html

      - name: Sauvegarder les images dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          # [skip ci] évite de redéclencher le workflow en boucle
          git commit -m "chore: nouvelle image générée [skip ci]" || echo "Rien à committer"
          git push

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./images
      - name: Uploader l'image en tant qu'artefact
        uses: actions/upload-artifact@v4
        with:
          name: image-generee
          path: images/*.png